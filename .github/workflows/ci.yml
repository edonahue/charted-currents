name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies from pyproject.toml
        run: python -m pip install .

      - name: Install Node dependencies
        run: npm ci

      - name: Preflight check
        run: npm run preflight

      - name: Build published data
        run: npm run data:build

      - name: Verify zero git diff on generated public data
        run: git diff --exit-code public/data/

      - name: Run historical invariant unit tests
        run: npm run data:test

      - name: Run published data schema validation
        run: npm run data:validate

      - name: Run validator negative test suite
        run: npm run data:test-negative

      - name: Run research access diagnostic unit tests
        run: npm run research:test-diagnostic

      - name: Astro check and build
        run: npm run verify
